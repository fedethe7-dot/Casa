<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Le mie app</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1c2130; --txt:#f2f4f8; --sub:#9aa3b5;
    --line:#252b3a; --acc:#6c8cff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --card:#ffffff; --card2:#eef1f8; --txt:#141821; --sub:#5d6678; --line:#e1e5ee; --acc:#3f63f0; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:calc(20px + env(safe-area-inset-top)) 16px 40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{
    margin:0 0 8px;border-radius:26px;overflow:hidden;position:relative;
    min-height:190px;padding:22px 20px;display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(180deg,#0b0d1200 30%,#0b0d12d9 100%),url("sfondo.jpg") center 40%/cover;
    color:#fff;
  }
  .saluto{color:#ffffffcc;font-size:15px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:4px;text-shadow:0 2px 12px #0006}
  .data{color:#ffffffb3;font-size:14px;margin-top:6px;text-transform:capitalize}
  h2{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin:22px 4px 10px}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  a.app{
    display:flex;flex-direction:column;justify-content:space-between;gap:18px;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:18px;min-height:150px;text-decoration:none;color:inherit;
    transition:transform .12s ease, background .12s ease;
  }
  a.app:active{transform:scale(.97);background:var(--card2)}
  .ico{
    width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;
  }
  .nome{font-size:18px;font-weight:650}
  .desc{font-size:13.5px;color:var(--sub);margin-top:4px;line-height:1.35}
  .presto{
    border:1.5px dashed var(--line);border-radius:22px;padding:18px;min-height:150px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    color:var(--sub);font-size:14px;text-align:center;gap:6px
  }
  .presto span{font-size:24px}
  footer{color:var(--sub);font-size:12px;text-align:center;margin-top:36px}

  /* ---------- Sequenza d'ingresso ---------- */
  #intro{
    position:fixed;inset:0;z-index:50;
    background:linear-gradient(180deg,#0b0d1240,#0b0d12bf),url("sfondo.jpg") center/cover #0b0d12;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    transition:opacity .5s ease, transform .6s cubic-bezier(.6,0,.2,1);
  }
  #intro.via{opacity:0;transform:scale(1.15);pointer-events:none}
  .logo{position:relative;width:132px;height:132px;margin-top:70px}
  .tetto{position:absolute;left:-40px;top:-92px;width:212px;height:110px;overflow:visible}
  .tetto path{stroke-dasharray:300;stroke-dashoffset:300;animation:disegna .6s ease .85s forwards}
  @keyframes disegna{to{stroke-dashoffset:0}}
  .q{
    position:absolute;width:58px;height:58px;border-radius:17px;opacity:0;
    animation:entra .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .q1{left:0;top:0;background:#34a373;--dx:-90px;--dy:-90px;animation-delay:.15s}
  .q2{right:0;top:0;background:#e0962f;--dx:90px;--dy:-90px;animation-delay:.32s}
  .q3{left:0;bottom:0;background:#9b72ff;--dx:-90px;--dy:90px;animation-delay:.49s}
  .q4{right:0;bottom:0;background:#f2f4f8;--dx:90px;--dy:90px;animation-delay:.66s}
  @keyframes entra{
    from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-25deg) scale(.4)}
    to{opacity:1;transform:none}
  }
  .logo::after{ /* bagliore che passa sopra il logo */
    content:"";position:absolute;inset:-20px;border-radius:40px;
    background:radial-gradient(circle,#6c8cff55,transparent 65%);
    opacity:0;animation:bagliore 1s ease 1.05s forwards;
  }
  @keyframes bagliore{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
  .titolo-intro{text-align:center;color:#f2f4f8;opacity:0;animation:sale .6s ease 1.1s forwards}
  .titolo-intro b{display:block;font-size:30px;letter-spacing:-.5px}
  .titolo-intro span{display:block;color:#9aa3b5;font-size:15px;margin-top:6px}
  @keyframes sale{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* le finestrelle arrivano una alla volta dopo l'intro */
  .pronta a.app,.pronta .presto{opacity:0;animation:sale .45s ease forwards}
  @media (prefers-reduced-motion: reduce){
    #intro{display:none}
    .pronta a.app,.pronta .presto{animation:none;opacity:1}
  }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="logo">
    <svg class="tetto" viewBox="0 0 212 110"><path d="M12 100 L106 14 L200 100" fill="none" stroke="#8fa6ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="q q1"></div><div class="q q2"></div><div class="q q3"></div><div class="q q4"></div>
  </div>
  <div class="titolo-intro"><b>Le mie app</b><span id="saluto-intro"></span></div>
</div>
<div class="wrap">
  <header>
    <div class="saluto" id="saluto">Ciao</div>
    <h1>Le mie app</h1>
    <div class="data" id="data"></div>
  </header>

  <h2>Casa e famiglia</h2>
  <div class="griglia" id="griglia"></div>

  <footer>Ecosistema di Federico · v4</footer>
</div>

<script>
  // Elenco delle app: per aggiungerne una basta una riga nuova qui.
  const APPS = [
    {
      nome: "Gestione Casa",
      desc: "Acquisti, fatture, garanzie e manuali",
      emoji: "🏠",
      colore: "#34a373",
      url: "https://fedethe7-dot.github.io/HomeVault/",
      gruppo: "Casa e famiglia"
    },
    {
      nome: "Lavori di casa",
      desc: "Lavori da fare, giorni liberi e fatti",
      emoji: "🧹",
      colore: "#e0962f",
      url: "https://fedethe7-dot.github.io/Lavori/",
      gruppo: "Casa e famiglia"
    },
    {
      nome: "Animali di casa",
      desc: "Jenny e Junny: cure, spese e promemoria",
      emoji: "🐶",
      colore: "#9b72ff",
      url: "https://fedethe7-dot.github.io/Animali/",
      gruppo: "Casa e famiglia"
    }
  ];

  const g = document.getElementById("griglia");
  APPS.forEach(a => {
    const el = document.createElement("a");
    el.className = "app";
    el.href = a.url;
    el.innerHTML = `
      <div class="ico" style="background:${a.colore}33">${a.emoji}</div>
      <div><div class="nome">${a.nome}</div><div class="desc">${a.desc}</div></div>`;
    g.appendChild(el);
  });
  const p = document.createElement("div");
  p.className = "presto";
  p.innerHTML = "<span>➕</span>Altre app in arrivo";
  g.appendChild(p);

  const ora = new Date().getHours();
  document.getElementById("saluto").textContent =
    ora < 13 ? "Buongiorno ☀️" : ora < 18 ? "Buon pomeriggio 👋" : "Buonasera 🌙";
  document.getElementById("data").textContent =
    new Date().toLocaleDateString("it-IT", {weekday:"long", day:"numeric", month:"long"});

  // ---------- Sequenza d'ingresso ----------
  // Si vede all'apertura dell'app; tocca lo schermo per saltarla.
  // Se torni all'hub entro 10 minuti (es. dopo aver aperto un'app) non si ripete.
  document.getElementById("saluto-intro").textContent =
    (ora < 13 ? "Buongiorno" : ora < 18 ? "Buon pomeriggio" : "Buonasera") + ", Federico";
  const intro = document.getElementById("intro");
  let recente = false;
  try { recente = Date.now() - Number(sessionStorage.getItem("introVista") || 0) < 600000; } catch(e){}
  function chiudiIntro(){
    if (intro.classList.contains("via")) return;
    intro.classList.add("via");
    document.querySelectorAll("a.app, .presto").forEach((el, i) => el.style.animationDelay = (i * 90) + "ms");
    document.body.classList.add("pronta");
    setTimeout(() => intro.remove(), 700);
    try { sessionStorage.setItem("introVista", Date.now()); } catch(e){}
  }
  if (recente || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    intro.remove();
  } else {
    intro.addEventListener("click", chiudiIntro);
    setTimeout(chiudiIntro, 2300);
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
